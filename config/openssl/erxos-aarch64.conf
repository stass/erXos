#
# OpenSSL's target for erXos on AArch64 (docs/design-crypto.md, "Building
# OpenSSL"), in Configure's own format: linux-aarch64's settings, its
# assembler included, compiled by erXos's clang against erXos's musl alone.
# tools/lib/erx/libcrypto.rb passes this file with --config and sets the
# variables it reads:
#
#   ERX_CC       the name of the clang every erXos build uses, which PATH finds
#   ERX_SYSROOT  a sysroot whose include/ holds musl's headers as one tree,
#                relative to the build directory
#
# Neither names a directory of the build host, so the compiler line OpenSSL
# keeps in the library (OpenSSL_version(OPENSSL_CFLAGS)) names none either.
# Configure records each value it reads, so make's reconfiguration of a
# changed build.info reads the same ones.

my %targets = (
    "erxos-aarch64" => {
        inherit_from => [ "linux-aarch64" ],
        # The target is part of the compiler's name, so Configure's probe of the
        # compiler's predefined macros sees the target's, not the build host's.
        CC           => env('ERX_CC') . " --target=aarch64-none-elf",
        AR           => "llvm-ar",
        RANLIB       => "llvm-ranlib",
        # musl's headers and clang's own alone (-nostdlibinc keeps clang's
        # builtin headers: stddef.h, stdarg.h, arm_neon.h). The stack protector
        # and outline atomics are off, as for ERTS's own code
        # (otp/xcomp/erl-xcomp-aarch64-unknown-erxos.conf); erXos's C library
        # has no outline atomics.
        cflags       => add("-nostdlibinc", "-isystem", env('ERX_SYSROOT') . "/include",
                            "-fno-stack-protector", "-mno-outline-atomics"),
        # erXos's branches of crypto/armcap.c and rand_unix.c's syscall_random.
        cppflags     => add("-D__erxos__"),
        # libcrypto.a is linked by ERTS's link, never here: no library is named.
        ex_libs      => "",
    },
);
