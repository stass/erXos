#
# OTP cross-compile file of the hosted runtime: ERTS for macOS, configured as
# the second cross target of docs/design-runtime.md. tools/erx build runtime
# reads it and sets ERX_HOSTED_LIBERX, ERX_SDKROOT, ERX_TREE and ERX_GEN.

erl_xcomp_build=guess
erl_xcomp_host=aarch64-hosted-erxos
erl_xcomp_configure_flags="ac_cv_func_madvise=no ac_cv_func_mlockall=no --disable-jit --enable-builtin-zlib --without-javac --without-odbc --without-wx --without-ssl --without-termcap --without-debugger --without-observer --without-et --without-megaco --without-snmp --disable-dynamic-ssl-lib"

CC=clang
CXX=clang++
LD=clang
AR=ar
RANLIB=ranlib
CFLAGS="-O2 -g -D__erxos__ -iquote${ERX_GEN:?} -iquote$ERX_GEN/include -iquote$ERX_TREE -iquote$ERX_TREE/include"
# C++ reads the same headers, and a struct must not differ between the two.
CXXFLAGS="-O2 -g -D__erxos__"

# An archive, not -force_load: configure links test programs of its own against this, and only
# an executable with no main takes the hosted entry from it.
LIBS="$ERX_HOSTED_LIBERX"

erl_xcomp_sysroot="$ERX_SDKROOT"

# Answers configure cannot find by running a test program.
erl_xcomp_bigendian=no
erl_xcomp_double_middle_endian=no
erl_xcomp_clock_gettime_cpu_time=no
erl_xcomp_after_morecore_hook=no
erl_xcomp_dlsym_brk_wrappers=no
erl_xcomp_getaddrinfo=no
erl_xcomp_gethrvtime_procfs_ioctl=no
erl_xcomp_kqueue=no
erl_xcomp_linux_clock_gettime_correction=no
erl_xcomp_linux_nptl=no
erl_xcomp_linux_usable_sigaltstack=no
erl_xcomp_linux_usable_sigusrx=no
erl_xcomp_poll=yes
erl_xcomp_posix_memalign=no
erl_xcomp_putenv_copy=no
erl_xcomp_reliable_fpe=no
erl_xcomp_code_model_small=no
