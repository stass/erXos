#
# OTP cross-compile file of the native runtime: ERTS over erXos's musl and the Fiasco
# backend, linked at the root task's addresses. Erx::NativeRuntime reads it for the
# interpreter and Erx::NativeJitRuntime for BeamAsm, and each sets ERX_CLANG,
# ERX_CLANG_INCLUDE, ERX_LLD, ERX_LLVM_BIN, ERX_SYSROOT, ERX_TREE and ERX_GEN, and the
# flavour's three: ERX_JIT, configure's JIT switch; ERX_CXX_INCLUDE, libc++'s headers,
# which C++ reads before musl's, empty for the interpreter, which compiles no C++; and
# ERX_CXX_LIBS, the C++ runtime's archives for the links, empty for the interpreter.

erl_xcomp_build=guess
erl_xcomp_host=aarch64-unknown-erxos
erl_xcomp_configure_flags="ac_cv_func_madvise=no ac_cv_func_mlockall=no ${ERX_JIT:?} --enable-builtin-zlib --without-javac --without-odbc --without-wx --without-ssl --without-termcap --without-debugger --without-observer --without-et --without-megaco --without-snmp --disable-dynamic-ssl-lib"

# The target's compiler: musl's headers and the compiler's own builtin headers, nothing else.
# No output names where the tree was checked out (BuildPath): __FILE__ names a source
# relative to the tree, and debug information names it under /erxos, an absolute path a
# debugger maps back to the tree (lldb: settings set target.source-map /erxos TREE).
ERX_TARGET_FLAGS="--target=aarch64-none-elf -nostdinc -isystem $ERX_SYSROOT/include -isystem $ERX_CLANG_INCLUDE -fmacro-prefix-map=$ERX_TREE/= -fdebug-prefix-map=$ERX_TREE=/erxos -fno-stack-protector -mno-outline-atomics -D_GNU_SOURCE"
CC="$ERX_CLANG $ERX_TARGET_FLAGS"
CXX="$ERX_LLVM_BIN/clang++ ${ERX_CXX_INCLUDE:+-isystem $ERX_CXX_INCLUDE} $ERX_TARGET_FLAGS"
LD="$ERX_CLANG $ERX_TARGET_FLAGS"
AR="$ERX_LLVM_BIN/llvm-ar"
RANLIB="$ERX_LLVM_BIN/llvm-ranlib"
# ERX_TRACE_START prints a line as ERTS starts, which the boot's transcript reads.
CFLAGS="-O2 -g -D__erxos__ -DERX_TRACE_START -iquote${ERX_GEN:?} -iquote$ERX_GEN/include -iquote$ERX_TREE -iquote$ERX_TREE/include"
# C++ reads the same headers, and a struct must not differ between the two. BeamAsm's
# C++ is built without exceptions or RTTI, as libc++ is (docs/design-runtime.md, "BeamAsm").
CXXFLAGS="-O2 -g -D__erxos__ -fno-exceptions -fno-rtti"

# The root's link. The libraries are in LDFLAGS, not LIBS, because OTP's make also links
# yielding_c_fun and erl_child_setup, without LIBS; nothing runs either. The linker keeps
# what an archive defines however late a name is asked for. configure's test programs link
# with their own main against the same archive, and only an executable with no main takes
# ERTS's entry from it. root.ld takes its place from the link: these take the test roots'
# place (ERX_ROOT_PLACE_FLAGS, NativeRoot::PLACE); none of them is the system's root, which
# NativeRoot links again at its machine's place.
LDFLAGS="-nostdlib -static --ld-path=$ERX_LLD -Wl,-T,$ERX_TREE/liberx/backend/fiasco/root.ld ${ERX_ROOT_PLACE_FLAGS:?} -Wl,-z,max-page-size=4096 -L$ERX_SYSROOT/lib -Wl,--start-group ${ERX_CXX_LIBS?} -lerxroot -lc -lgcc -lboot_cores -lsigma0 -ll4sys.p -Wl,--end-group"

erl_xcomp_sysroot="$ERX_SYSROOT"

# Answers configure cannot find by running a test program.
erl_xcomp_bigendian=no
erl_xcomp_double_middle_endian=no
erl_xcomp_clock_gettime_cpu_time=no
erl_xcomp_after_morecore_hook=no
erl_xcomp_dlsym_brk_wrappers=no
erl_xcomp_getaddrinfo=no
erl_xcomp_gethrvtime_procfs_ioctl=no
erl_xcomp_kqueue=no
erl_xcomp_linux_clock_gettime_correction=no
erl_xcomp_linux_nptl=no
erl_xcomp_linux_usable_sigaltstack=no
erl_xcomp_linux_usable_sigusrx=no
erl_xcomp_poll=yes
erl_xcomp_posix_memalign=no
erl_xcomp_putenv_copy=no
erl_xcomp_reliable_fpe=no
erl_xcomp_code_model_small=no
