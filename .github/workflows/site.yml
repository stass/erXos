# Builds the website (site/README.md) into a GitHub Pages artifact.
#
# Manual only. The build job uploads build/site as a Pages artifact and the
# deploy job publishes it; GitHub Pages must be enabled for the repository
# with "GitHub Actions" as its source.
#
# The erXos image needs the full erXos toolchain (the cross compilers, the
# OTP and Fiasco builds), which this job does not set up. It takes the image
# from a URL instead, normally a release asset, and checks it against the
# SHA-256 given with it.
#
# Each action is pinned to the commit of the tag named beside it.
name: site

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: URL of an interactive production image.boot (e.g. a release asset)
        required: true
      image_sha256:
        description: SHA-256 of that image.boot
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby clang lld default-jre-headless make
          rustup target add wasm32-unknown-unknown
      - name: Fetch the pinned v64 and Closure Compiler
        run: |
          tools/erx fetch --source v64
          tools/erx fetch --source closure-compiler
      - name: Download the erXos image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          IMAGE_SHA256: ${{ inputs.image_sha256 }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 300 --output image.boot "$IMAGE_URL"
          echo "$IMAGE_SHA256  image.boot" | sha256sum --check
      - name: Build v64 and assemble the site
        run: ruby tools/build_site.rb --image image.boot
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
