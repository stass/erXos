# Builds the website (site/README.md) into a GitHub Pages artifact.
#
# Manual only. The build job uploads build/site as a Pages artifact and the
# deploy job publishes it; GitHub Pages must be enabled for the repository
# with "GitHub Actions" as its source.
#
# The erXos image and the Raspberry Pi 4's card need the full erXos toolchain
# (the cross compilers, the OTP and Fiasco builds), which this job does not
# set up. It takes each, and the card's build record, from a URL instead,
# normally a release asset, and checks it against the SHA-256 given with it;
# tools/build_site.rb then refuses a record that does not name the card's
# SHA-256 or the commit image_source resolves to, built with no changes,
# and publishes the card xz-compressed (Erx::Site::XZ_ARGUMENTS).
# The image and the card carry GPL-2.0 files, so the page links the erXos
# source both were built from: the commit image_source, a release tag or a
# commit, resolves to.
#
# Each action is pinned to the commit of the tag named beside it.
name: site

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: URL of an interactive production image.boot (e.g. a release asset)
        required: true
      image_sha256:
        description: SHA-256 of that image.boot
        required: true
      image_source:
        description: the erXos release tag or full commit the image and the card were built from; the page links its source
        required: true
      card_url:
        description: URL of the Raspberry Pi 4's sdcard.img (e.g. a release asset)
        required: true
      card_sha256:
        description: SHA-256 of that sdcard.img
        required: true
      card_record_url:
        description: URL of the card's build record, its sdcard.img.receipt.json
        required: true
      card_record_sha256:
        description: SHA-256 of that sdcard.img.receipt.json
        required: true

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than cancelling one
# in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check the inputs
        env:
          IMAGE_SHA256: ${{ inputs.image_sha256 }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
          CARD_SHA256: ${{ inputs.card_sha256 }}
          CARD_RECORD_SHA256: ${{ inputs.card_record_sha256 }}
        run: |
          [[ "$IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "image_sha256 must be 64 lowercase hex digits" >&2; exit 1; }
          [[ "$CARD_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "card_sha256 must be 64 lowercase hex digits" >&2; exit 1; }
          [[ "$CARD_RECORD_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "card_record_sha256 must be 64 lowercase hex digits" >&2; exit 1; }
          [[ "$IMAGE_SOURCE" =~ ^[0-9a-f]{40}$ ]] ||
            { [[ "$IMAGE_SOURCE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] && [[ "$IMAGE_SOURCE" != *..* ]]; } ||
            { echo "image_source must be a release tag or a 40-hex commit" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The whole history and its tags, so the image's source resolves to a commit.
          fetch-depth: 0
      - name: Resolve the image's source to a commit of this repository
        env:
          IMAGE_SOURCE: ${{ inputs.image_source }}
        run: |
          if [[ "$IMAGE_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then ref="$IMAGE_SOURCE"; else ref="refs/tags/$IMAGE_SOURCE"; fi
          commit=$(git rev-parse --verify --quiet "$ref^{commit}") ||
            { echo "image_source names no commit or tag of this repository" >&2; exit 1; }
          echo "IMAGE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby clang lld default-jre-headless make xz-utils
          rustup target add wasm32-unknown-unknown
          # erXos's tools run each subprocess under GNU timeout by its Homebrew name.
          sudo ln -sf /usr/bin/timeout /usr/local/bin/gtimeout
      - name: Fetch the pinned v64 and Closure Compiler
        run: |
          tools/erx fetch --source v64
          tools/erx fetch --source closure-compiler
      - name: Download the erXos image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          IMAGE_SHA256: ${{ inputs.image_sha256 }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 300 --max-filesize 1073741824 \
            --output image.boot --url "$IMAGE_URL"
          echo "$IMAGE_SHA256  image.boot" | sha256sum --check --strict
      - name: Download the Raspberry Pi 4's card
        env:
          CARD_URL: ${{ inputs.card_url }}
          CARD_SHA256: ${{ inputs.card_sha256 }}
          CARD_RECORD_URL: ${{ inputs.card_record_url }}
          CARD_RECORD_SHA256: ${{ inputs.card_record_sha256 }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 600 --max-filesize 1073741824 \
            --output sdcard.img --url "$CARD_URL"
          echo "$CARD_SHA256  sdcard.img" | sha256sum --check --strict
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 1048576 \
            --output sdcard.img.receipt.json --url "$CARD_RECORD_URL"
          echo "$CARD_RECORD_SHA256  sdcard.img.receipt.json" | sha256sum --check --strict
      - name: Build v64 and assemble the site
        run: ruby tools/build_site.rb --image image.boot --card sdcard.img --card-record sdcard.img.receipt.json --source "$IMAGE_COMMIT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
